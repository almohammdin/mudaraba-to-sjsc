name: Refine strategy comparison

on:
  push:
    paths:
      - 'scripts/refine_strategy_comparison.py'
      - '.github/workflows/refine-strategy-comparison.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply comparison update
        run: python scripts/refine_strategy_comparison.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine Mudarabah versus SJSC comparison"
          git push