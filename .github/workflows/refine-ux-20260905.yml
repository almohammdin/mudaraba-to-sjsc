name: Refine UX 20260905

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refine_ux_20260905.py"
      - ".github/workflows/refine-ux-20260905.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX refinements
        run: python scripts/refine_ux_20260905.py
      - name: Validate markers
        run: |
          grep -q 'data-refine-20260905="1"' index.html
          grep -q 'شركة أرباح طيبة: ثلاث فئات داخل رأس مال واحد' index.html
          grep -q 'التكييف لدى هيئة السوق المالية' index.html
          ! grep -q 'قضية سنام الأعمال' index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine comparison, structure and share examples"
          git push
