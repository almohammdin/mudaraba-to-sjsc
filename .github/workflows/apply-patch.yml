name: Apply site patch

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply_patch_v7.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_patch_v7.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Naif Almohammdi"
          git config user.email "almohammdin@gmail.com"
          git add mudaraba-controls/index.html
          git commit -m "Add marketing and CMA analysis to mudaraba study"
          git push origin HEAD:main
