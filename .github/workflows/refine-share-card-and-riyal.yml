name: Refine share card and Riyal symbol
on:
  push:
    paths:
      - 'scripts/refine_share_card_and_riyal.py'
      - '.github/workflows/refine-share-card-and-riyal.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply layout and symbol update
        run: python scripts/refine_share_card_and_riyal.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Refine share cards and Riyal symbol"
          git push
