name: Apply main V2

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply_main_v2.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V2 patch
        run: python scripts/apply_main_v2.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, re.S)
          inline = '\n'.join(b for b in blocks if b.strip())
          Path('/tmp/site-inline.js').write_text(inline, encoding='utf-8')
          print('inline JS bytes:', len(inline.encode('utf-8')))
          PY
          node --check /tmp/site-inline.js
      - name: Validate V2 markers
        run: |
          grep -q 'data-main-v2="1"' index.html
          grep -q 'id="exportSummary"' index.html
          grep -q 'id="readProgressBar"' index.html
          grep -q 'data-model="management"' index.html
          grep -q 'id="shareCapWarning"' index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Naif Almohammdi"
          git config user.email "almohammdin@gmail.com"
          git add index.html
          git commit -m "Upgrade main study to interactive V2"
          git push origin HEAD:main
